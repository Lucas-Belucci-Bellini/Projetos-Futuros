name: Catalogo - stack web e Rust

on:
  push:
    branches:
      - catalogo-materiais-construcao-londrina
    paths:
      - "projetos/catalogo-materiais-construcao-londrina/apps/web/**"
      - "projetos/catalogo-materiais-construcao-londrina/apps/api/**"
      - ".github/workflows/catalogo-stack.yml"
  pull_request:
    paths:
      - "projetos/catalogo-materiais-construcao-londrina/apps/web/**"
      - "projetos/catalogo-materiais-construcao-londrina/apps/api/**"
      - ".github/workflows/catalogo-stack.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetos/catalogo-materiais-construcao-londrina/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  rust-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetos/catalogo-materiais-construcao-londrina/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test
