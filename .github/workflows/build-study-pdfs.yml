name: Build Study PDFs

on:
  push:
    branches:
      - claude/ecstatic-babbage-8hoz50
    paths:
      - "estudos/**/*.md"
      - "scripts/build-study-pdfs.sh"
      - ".github/workflows/build-study-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: Generate PDFs
        run: |
          chmod +x scripts/build-study-pdfs.sh
          scripts/build-study-pdfs.sh

      - name: Verify generated PDFs
        run: |
          find estudos -type f -name "*.pdf" -print
          test -f estudos/ESTUDOS-REVISOES-COMPLETAS.pdf
          test -f estudos/PDF-INDEX.md

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estudos/**/*.pdf estudos/*.pdf estudos/PDF-INDEX.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          git commit -m "docs(estudos): gera PDFs das revisoes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
